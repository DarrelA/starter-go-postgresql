apiVersion: batch/v1
kind: Job
metadata:
  name: starter-go-postgresql-migrate
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/example/starter-go-postgresql:RELEASE_TAG
          command: ['./starter-go-postgresql-migrate']
          envFrom:
            - secretRef:
                name: starter-go-postgresql-database
